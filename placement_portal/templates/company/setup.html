{% extends 'base.html' %}

{% block title %}Complete Your Company Profile{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 63px)">
    <div class="auth-wrapper setup-container">

        <div class="welcome-header">
            <h2 class="auth-title">Welcome, {{ user.name }}!</h2>
            <p class="auth-subtitle">Let's set up your profile so others can know more about you.</p>
        </div>

        <form action="/company/setup" method="POST" enctype="multipart/form-data" onsubmit="return validateSetup()">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">HR Name</label>
                    <input type="text" class="form-control glass-input text-capitalize" id="hr_name" name="hr_name"
                        placeholder="John" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Team Size</label>
                    <input type="number" class="form-control glass-input" name="employee_count" placeholder="No. of Employees"
                     min="0" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control glass-input text-capitalize" name="location"
                    placeholder="23, Main St, Austin, TX 78701" required>
                <small class="text-white-50 ms-1">Separate location parts with commas</small>
            </div>

            <div class="mb-3">
                <label class="form-label">Website</label>
                <input type="url" class="form-control glass-input" id="website" name="website" placeholder="https://example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Enterprise Synopsis</label>
                <textarea class="form-control glass-input" name="description" rows="3"
                    placeholder="Company Description"></textarea>
            </div>

            <button type="submit" class="btn-auth">Complete Profile</button>
        </form>
    </div>
</div>
{% endblock %}
