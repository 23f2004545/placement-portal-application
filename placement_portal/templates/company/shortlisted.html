{% extends 'company/dashboard.html' %}

{% block title %}Shortlisted{% endblock %}

{% block dashboard_content %}
<div class="container-fluid fade-in">
    <h3 class="text-white fw-bold mb-4">Shortlisted Candidates</h3>

    <div class="row g-3">
        {% for app in shortlisted %}
        <div class="col-lg-6">
            <div class="glass-card p-3 d-flex align-items-center gap-3 position-relative">
                
                <button class="btn btn-icon-danger position-absolute top-0 end-0 m-2" title="Remove from Shortlist">
                    <i class="bi bi-x-lg"></i>
                </button>

                <img src="{{ url_for('static', filename=app.student.user.image_url) }}" class="rounded-circle border border-warning" style="width: 70px; height: 70px; object-fit: cover;">
                
                <div class="flex-grow-1">
                    <h5 class="text-white fw-bold mb-0">{{ app.student.user.name }}</h5>
                    <p class="text-success small mb-1">{{ app.job.title }}</p>
                    <div class="d-flex gap-2">
                        <a href="#" class="btn btn-xs btn-outline-light rounded-pill">View Profile</a>
                        <a href="{{ url_for('static', filename=app.custom_resume) }}" target="_blank" class="btn btn-xs btn-outline-light rounded-pill">Resume</a>
                    </div>
                </div>

                <div>
                    <button class="btn btn-success btn-circle btn-lg shadow-lg" title="Select Candidate">
                        <i class="bi bi-check-lg"></i>
                    </button>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
