{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 63px)">
<div class="login-wrapper" style="margin-top: -40px;">
    
    <div class="img-section">
        <div style="position: absolute; inset:0; background: rgba(0,0,0,0.3);"></div>
        <div class="overlay-text">
            <h3>APEX</h3>
            <p class="mb-0 opacity-85">Your all-in-one career launchpad.</p>
        </div>
    </div>

    <div class="form-section">
        <h2 class="text-white fw-bold mb-4">Welcome back !</h2>
        
        <form action="/login" method="POST">
            <div class="mb-4">
                <input type="email" class="form-control" placeholder="Email address" name="email" required>
            </div>
            
            <div class="mb-4">
                <input type="password" class="form-control" placeholder="Password" name="password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-custom">Sign In</button>
            </div>

            <div class="text-center mt-4">
                <p class="text-white-50" > Not a user ?  <a href="/register" class="text-white fw-bold text-decoration-none ms-1"><u>&nbsp;Register</u></a></p>
            </div>
        </form>
    </div>
</div>
</div>
{% endblock %}
