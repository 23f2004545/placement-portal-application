{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 63px)">
<div class="auth-wrapper login-container" style="margin-top: -40px;">
    
    <div class="login-img-section">
        <div style="position: absolute; inset:0; background: rgba(0,0,0,0.3);"></div>
        <div class="login-overlay-text">
            <h3>APEX</h3>
            <p class="mb-0 opacity-85">Your all-in-one career launchpad.</p>
        </div>
    </div>

    <div class="login-form-section">
        <h2 class="text-white fw-bold mb-4">Welcome back !</h2>
        
        <form action="/auth/login" method="POST">
            <div class="mb-4">
                <input type="email" class="form-control glass-input" placeholder="Email address" name="email" required>
            </div>
            
            <div class="mb-4">
                <input type="password" class="form-control glass-input" placeholder="Password" name="password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn-auth ">Sign In</button>
            </div>

            <!-- QUICK DEMO LOGIN BUTTONS FOR PORTFOLIO REVIEWS -->
            <div class="mt-4 pt-3 border-top border-secondary" style="border-color: rgba(255,255,255,0.15) !important;">
                <p class="text-white-50 text-center small mb-2">
                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i><strong>Instant Demo Preview</strong>
                </p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a href="{{ url_for('auth_bp.demo_login', role='admin') }}" class="btn btn-sm btn-outline-warning rounded-pill px-3" title="Login as Admin">
                        <i class="bi bi-shield-lock me-1"></i> Admin
                    </a>
                    <a href="{{ url_for('auth_bp.demo_login', role='company') }}" class="btn btn-sm btn-outline-info rounded-pill px-3" title="Login as Recruiter">
                        <i class="bi bi-building me-1"></i> Recruiter
                    </a>
                    <a href="{{ url_for('auth_bp.demo_login', role='student') }}" class="btn btn-sm btn-outline-success rounded-pill px-3" title="Login as Student">
                        <i class="bi bi-mortarboard me-1"></i> Student
                    </a>
                </div>
            </div>

            <div class="text-center mt-3">
                <p class="text-white-50 small mb-0"> Not a user ?  <a href="/auth/register" class="text-white fw-bold text-decoration-none ms-1"><u>&nbsp;Register</u></a></p>
            </div>
        </form>
    </div>
</div>
</div>
{% endblock %}
