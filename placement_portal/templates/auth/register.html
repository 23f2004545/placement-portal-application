{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 63px)">
    <div class="auth-wrapper register-container">
        <h2 class="auth-title">Get Started</h2>
        <p class="auth-subtitle">Create your account to join the Apex portal.</p>

        <!-- Add required checks and validations to field using js or pattern(html attribute) -->
        <form action="/auth/register" method="POST" enctype="multipart/form-data" onsubmit="return validateFileSize()">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Name / Company</label>
                    <input type="text" class="form-control glass-input text-capitalize" id="name" name="name"
                        placeholder="John" required>
                </div>
                <div class="col-md-6">
                    <label for="role" class="form-label">I am a...</label>
                    <select class="form-select glass-input" id="role" name="role" required>
                        <option value="" selected disabled>Select Role</option>
                        <option value="student">Student</option>
                        <option value="company">Company / Recruiter</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control glass-input" id="email" name="email"
                        placeholder="name@example.com" required>
                </div>
                <div class="col-md-6">
                    <label for="contact" class="form-label">Contact Number</label>
                    <input type="tel" class="form-control glass-input" id="contact" name="contact"
                        placeholder="+91 98765..." pattern="\d{10}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control glass-input" id="password" name="password"
                    placeholder="Create a strong password" minlength="8" required>
            </div>

            <div class="mb-4">
                <label for="profile_pic" class="form-label">
                    Profile Picture <span class="text-white-50 fw-normal">(Max 2MB)</span>
                </label>
                <input type="file" class="form-control glass-input" id="profile_pic" name="profile_pic"
                    accept="image/*">
                <small id="fileSizeError" class="text-danger mt-1" style="display: none;">File is too large! Max size is
                    2MB.</small>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn-auth">Create Account</button>
            </div>

            <div class="text-center mt-4">
                <span class="text-white-50">Already have an account?</span>
                <a href="/auth/login" class="text-white fw-bold text-decoration-none ms-1"><u>Sign In</u></a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
{% block script %}

<script>
    function validateFileSize() {
        const fileInput = document.getElementById('profile_pic');
        const errorMsg = document.getElementById('fileSizeError');
        const maxSize = 2 * 1024 * 1024; // 2MB in bytes

        if (fileInput.files.length > 0) {
            const fileSize = fileInput.files[0].size;
            if (fileSize > maxSize) {
                errorMsg.style.display = 'block';
                return false; // Stop form submission
            }
        }
        errorMsg.style.display = 'none';
        return true; // Allow submission
    }
</script>

{% endblock %}
